
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
}

.card {
    background: rgba(255,255,255,0.9);
    padding: 35px 25px;
    border-radius: 25px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 10px 40px #b65b8c55;
    z-index: 2;
}

h1 {
    color: #ff4081;
    font-size: 35px;
    margin-bottom: 15px;
}

.name {
    color: #9c27b0;
    font-size: 30px;
    font-weight: bold;
}

.cake {
    font-size: 85px;
    margin: 20px;
    animation: bounce 1s infinite alternate;
}

p {
    color: #555;
    font-size: 17px;
    line-height: 1.7;
    margin: 15px 0;
}

button {
    background: linear-gradient(45deg, #ff4081, #9c27b0);
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    transform: scale(1.08);
}

#surprise {
    display: none;
    color: #e91e63;
    font-size: 18px;
    margin-top: 20px;
    animation: fade 2s;
}

.heart {
    position: absolute;
    bottom: -30px;
    animation: float 6s linear infinite;
    font-size: 25px;
}

@keyframes bounce {
    to { transform: translateY(-12px); }
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>
</head>

<body>

<div class="card">
    <h1>🎉 Happy Birthday 🎉</h1>

    <div class="name">Your Name ❤️</div>

    <div class="cake">🎂</div>

    <p>
        Today is your special day! 💖<br>
        May your life be filled with happiness,<br>
        love, laughter and endless smiles.
    </p>

    <button onclick="showSurprise()">
        🎁 Open Your Surprise
    </button>

    <div id="surprise">
        🌹 You are one of the most special people! 🌹
        <br><br>
        May all your dreams come true.<br>
        Keep smiling and shining always! ✨
        <br><br>
        Lots of love ❤️🎀
    </div>
</div>

<script>
function showSurprise() {
    document.getElementById("surprise").style.display = "block";
}

function createHeart() {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = ["❤️","💖","💕","🌸","✨"][Math.floor(Math.random()*5)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random()*4) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
}

setInterval(createHeart, 400);
</script>

</body>
</html>
